<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch scan - mock</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a}
  .app{max-width:1100px;margin:0 auto;padding:12px 12px 90px}
  header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px}
  header small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#64748b;font-weight:600}
  header h1{margin:2px 0 0;font-size:20px}
  nav{display:flex;gap:4px;background:#fff;border:1px solid #e2e8f0;border-radius:99px;padding:4px}
  nav a{padding:6px 12px;border-radius:99px;font-size:13px;color:#475569}
  nav a.on{background:#0f172a;color:#fff}
  .layout{display:grid;gap:12px}
  @media(min-width:900px){.layout{grid-template-columns:380px 1fr;align-items:start}.tabs{display:none}.lists{display:grid!important;grid-template-columns:1fr 1fr;gap:12px}.col{display:block!important}}
  .cam{position:sticky;top:0;z-index:5;border-radius:20px;overflow:hidden;background:#0b1220;height:240px}
  .cam .feed{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#1e293b,#1e293b 12px,#172033 12px,#172033 24px);display:flex;align-items:center;justify-content:center;color:#64748b;font-size:13px}
  .reticle{position:absolute;left:8%;right:8%;top:50%;height:90px;transform:translateY(-50%);border:2px solid rgba(255,255,255,.75);border-radius:12px;transition:.15s}
  .reticle.ok{border-color:#22c55e;box-shadow:0 0 0 999px rgba(34,197,94,.18)}
  .reticle::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:#ef4444;animation:sweep 1.6s ease-in-out infinite alternate}
  @keyframes sweep{from{top:12%}to{top:88%}}
  .cam .bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.7))}
  .pill{border:1px solid rgba(255,255,255,.4);color:#fff;background:rgba(255,255,255,.12);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
  .live{position:absolute;top:10px;left:10px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
  .counter{position:absolute;top:10px;right:10px;background:#fff;color:#0f172a;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
  .tabs{display:flex;background:#fff;border:1px solid #e2e8f0;border-radius:99px;padding:4px}
  .tabs button{flex:1;border:0;background:none;padding:8px;border-radius:99px;font-weight:600;font-size:13px;color:#475569}
  .tabs button.on{background:#4f46e5;color:#fff}
  .lists{display:block}
  .col{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:10px;min-height:120px}
  .col.hidden{display:none}
  .col h2{margin:4px 6px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#64748b;display:flex;justify-content:space-between}
  .row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;border:1px solid #f1f5f9;margin-bottom:6px;animation:in .25s}
  @keyframes in{from{opacity:0;transform:translateY(-8px)}}
  .row.done{background:#f0fdf4;border-color:#bbf7d0}
  .row.warn{background:#fffbeb;border-color:#fde68a}
  .cover{width:42px;height:60px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;text-align:center}
  .skel{background:linear-gradient(90deg,#e2e8f0,#f1f5f9,#e2e8f0);background-size:200%;animation:sh 1s infinite}
  @keyframes sh{to{background-position:-200%}}
  .info{flex:1;min-width:0}
  .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info span{font-size:12px;color:#64748b}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:4px;background:#fde68a;color:#92400e}
  .badge.own{background:#e0e7ff;color:#3730a3}
  .acts{display:flex;gap:4px}
  .acts button{width:38px;height:38px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;font-size:16px;cursor:pointer}
  .acts .v{color:#16a34a}.acts .x{color:#dc2626}.acts .r{color:#4f46e5}
  .kinds{display:flex;gap:4px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:4px;margin-top:10px;align-items:center}
  .kinds span{font-size:12px;color:#64748b;padding:0 8px;font-weight:600}
  .kinds button.k{flex:1;border:0;background:none;padding:9px 6px;border-radius:12px;font-weight:700;font-size:13px;color:#475569;cursor:pointer}
  .kinds button.k.on{color:#fff}
  .kinds button.all{border:1px dashed #94a3b8;background:#f8fafc;border-radius:12px;padding:8px 10px;font-size:12px;cursor:pointer;color:#334155}
  .k-Book.on{background:#0369a1}.k-BD.on{background:#b45309}.k-Manga.on{background:#be185d}
  .chip{display:inline-block;border:0;cursor:pointer;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:3px;color:#fff}
  .chip.Book{background:#0369a1}.chip.BD{background:#b45309}.chip.Manga{background:#be185d}
  .empty{padding:24px;text-align:center;color:#94a3b8;font-size:13px}
  .save{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 12px;display:flex;gap:8px;justify-content:center;align-items:center}
  .save button{background:#0f172a;color:#fff;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;flex:1;max-width:340px}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;display:none;z-index:9}
  .toast u{margin-left:10px;cursor:pointer;color:#a5b4fc}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><small>Personal library</small><h1>Libray</h1></div>
    <nav><a>Books</a><a class="on">Batch scan</a><a>Collections</a></nav>
  </header>

  <div class="layout">
    <div>
      <div class="cam">
        <div class="feed">camera preview (always on)</div>
        <div class="reticle" id="reticle"></div>
        <span class="live">● LIVE</span>
        <span class="counter" id="counter">0 scanned</span>
        <div class="bar">
          <button class="pill">🔦 Light</button>
          <button class="pill" id="sim">▶ Simulate scan</button>
          <button class="pill">⌨ Type ISBN</button>
        </div>
      </div>
      <div class="kinds">
        <span>New scans:</span>
        <button class="k k-Book on" data-k="Book">📖 Book</button>
        <button class="k k-BD" data-k="BD">🎨 BD</button>
        <button class="k k-Manga" data-k="Manga">🈶 Manga</button>
        <button class="all" id="applyAll" title="Set every book in the lists to the selected type">Apply to all</button>
      </div>
    </div>

    <div>
      <div class="tabs">
        <button id="tab-main" class="on">To review (<span id="n-main">0</span>)</button>
        <button id="tab-re">Rescan (<span id="n-re">0</span>)</button>
      </div>
      <div class="lists" style="margin-top:10px">
        <div class="col" id="col-main"><h2>To review <span id="h-main"></span></h2><div id="list-main"></div></div>
        <div class="col hidden" id="col-re"><h2>Rescan <span></span></h2><div id="list-re"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="save">
  <button id="save">Add 0 books to library</button>
</div>
<div class="toast" id="toast"></div>

<script>
const pool=[
 ["Astérix le Gaulois","René Goscinny","#b45309"],
 ["L'Étranger","Albert Camus","#334155"],
 ["One Piece T.1","Eiichiro Oda","#0369a1"],
 ["Dune","Frank Herbert","#a16207"],
 ["Le Petit Prince","A. de Saint-Exupéry","#0f766e"],
 ["Les Misérables","Victor Hugo","#7f1d1d"],
 ["Berserk T.3","Kentaro Miura","#18181b"],
 ["Fondation","Isaac Asimov","#4338ca"],
 [null,null,"#94a3b8"]
];
let main=[],re=[],id=0,last=null,pi=0,gKind="Book";
const KINDS=["Book","BD","Manga"];
const $=s=>document.querySelector(s);
function rowHtml(b,inRe){
  const cover=b.loading?'<div class="cover skel"></div>':`<div class="cover" style="background:${b.color}">${b.title?b.title.slice(0,12):"?"}</div>`;
  const t=b.loading?'<b>Looking up…</b><span>ISBN '+b.isbn+'</span>':`<b>${b.title||"Unknown book"}${b.owned?'<i class="badge own">Owned</i>':''}${!b.title?'<i class="badge">Not found</i>':''}</b><span>${b.author||"ISBN "+b.isbn}</span><button class="chip ${b.kind}" data-a="kind" data-i="${b.id}" title="Tap to change type">${b.kind} ▾</button>`;
  const acts=inRe
   ?`<button class="r" title="Re-lookup" data-a="relook" data-i="${b.id}">⟳</button><button class="v" title="Move back" data-a="back" data-i="${b.id}">↩</button><button class="x" data-a="del" data-i="${b.id}">✕</button>`
   :`<button class="v" data-a="ok" data-i="${b.id}">✓</button><button class="r" data-a="rescan" data-i="${b.id}">↻</button><button class="x" data-a="del" data-i="${b.id}">✕</button>`;
  return `<div class="row ${b.ok?"done":""} ${!b.title&&!b.loading?"warn":""}">${cover}<div class="info">${t}</div><div class="acts">${acts}</div></div>`;
}
function render(){
  $("#list-main").innerHTML=main.map(b=>rowHtml(b,false)).join("")||'<div class="empty">Scan a barcode — books appear here instantly</div>';
  $("#list-re").innerHTML=re.map(b=>rowHtml(b,true)).join("")||'<div class="empty">Books you flag with ↻ wait here</div>';
  $("#n-main").textContent=main.length;$("#n-re").textContent=re.length;
  $("#counter").textContent=(main.length+re.length)+" scanned";
  const n=main.filter(b=>!b.owned&&!b.loading).length;
  $("#save").textContent=`Add ${n} book${n==1?"":"s"} to library`;
}
function scan(){
  const p=pool[pi++%pool.length];
  const b={id:++id,isbn:"978"+String(2000000000+id*7919).slice(0,9)+"0",loading:true,color:p[2],kind:gKind};
  main.unshift(b);render();
  $("#reticle").classList.add("ok");navigator.vibrate&&navigator.vibrate(50);
  setTimeout(()=>$("#reticle").classList.remove("ok"),300);
  setTimeout(()=>{b.title=p[0];b.author=p[1];b.loading=false;b.owned=pi%5==0&&!!p[0];render()},900);
}
function toast(msg,undo){const t=$("#toast");t.innerHTML=msg+(undo?"<u>Undo</u>":"");t.style.display="block";if(undo)t.querySelector("u").onclick=()=>{undo();t.style.display="none"};clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",4000)}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const i=+el.dataset.i,a=el.dataset.a;
  const find=l=>l.findIndex(b=>b.id==i);
  if(a=="kind"){const b=[...main,...re].find(x=>x.id==i);b.kind=KINDS[(KINDS.indexOf(b.kind)+1)%3]}
  if(a=="ok"){const b=main[find(main)];b.ok=!b.ok}
  if(a=="rescan"){const [b]=main.splice(find(main),1);b.ok=false;re.unshift(b);toast("Moved to Rescan")}
  if(a=="back"){const [b]=re.splice(find(re),1);main.unshift(b)}
  if(a=="relook"){const b=re[find(re)];const p=pool[0];b.loading=true;render();setTimeout(()=>{b.title=p[0];b.author=p[1];b.color=p[2];b.loading=false;render()},700);return}
  if(a=="del"){const l=find(main)>=0?main:re;const k=find(l);const [b]=l.splice(k,1);toast("Book removed",()=>{l.splice(k,0,b);render()})}
  render();
});
$("#sim").onclick=scan;
document.querySelectorAll("[data-k]").forEach(btn=>btn.onclick=()=>{gKind=btn.dataset.k;document.querySelectorAll("[data-k]").forEach(x=>x.classList.toggle("on",x===btn))});
$("#applyAll").onclick=()=>{[...main,...re].forEach(b=>b.kind=gKind);render();toast(`All set to ${gKind}`)};
$("#save").onclick=()=>{const ok=main.filter(b=>!b.owned&&!b.loading);const c={};ok.forEach(b=>c[b.kind]=(c[b.kind]||0)+1);main=main.filter(b=>b.owned||b.loading);render();toast(`✔ ${ok.length} added: `+(Object.entries(c).map(([k,v])=>v+" "+k).join(", ")||"nothing"))};
$("#tab-main").onclick=()=>{$("#col-main").classList.remove("hidden");$("#col-re").classList.add("hidden");$("#tab-main").classList.add("on");$("#tab-re").classList.remove("on")};
$("#tab-re").onclick=()=>{$("#col-re").classList.remove("hidden");$("#col-main").classList.add("hidden");$("#tab-re").classList.add("on");$("#tab-main").classList.remove("on")};
render();scan();setTimeout(scan,500);setTimeout(scan,1000);
</script>
</body>
</html>
